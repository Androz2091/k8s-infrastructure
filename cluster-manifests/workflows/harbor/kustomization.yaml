helmCharts:
  - name: harbor
    releaseName: harbor
    namespace: workflows
    version: 1.19.4 # Harbor 2.15.4: the 2026-10-06 advisories (#120)
    repo: https://helm.goharbor.io
    valuesInline:
      externalURL: https://harbor.androz2091.fr
      persistence:
        persistentVolumeClaim:
          registry:
            size: 10Gi
      # jobservice:
      #   jobLoggers:
      #     - database # todo ask Sylvain about this
      harborAdminPassword: this-must-be-changed # updated in the UI at first login
      expose:
        type: clusterIP
        tls:
          enabled: false

namespace: workflows

patches: []
