# PostgreSQL 17, migrated from postgresql (15) by dump/restore (#13). The Service points here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-17
  namespace: db
  labels:
    app: postgresql-17
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql-17
  template:
    metadata:
      labels:
        app: postgresql-17
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: postgresql-17
              topologyKey: kubernetes.io/hostname

      containers:
        - name: postgresql
          image: postgres:17.11
          # sized for the 64 GB worker it shares with the apps; command-line
          # settings win over postgresql.conf in the volume.
          # random_page_cost stays at the default 4: the disks are HDDs (RAID 1)
          args:
            - "-c"
            - "shared_buffers=2GB"
            - "-c"
            - "effective_cache_size=16GB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - "-c"
            - "effective_io_concurrency=2"
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
            - name: "POSTGRES_USER"
              value: "postgres"
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: postgresql-secrets
          volumeMounts:
            - mountPath: /var/lib/postgresql/data/
              name: postgresql-v
            # parallel query workers share memory through /dev/shm,
            # and the container default of 64 MB is too small for them
            - mountPath: /dev/shm
              name: dshm
          # a request makes the pod Burstable instead of BestEffort,
          # so the kubelet evicts it after the BestEffort pods under memory pressure
          resources:
            requests:
              memory: 3Gi
        #
      volumes:
        - name: postgresql-v
          persistentVolumeClaim:
            claimName: postgresql-17-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
