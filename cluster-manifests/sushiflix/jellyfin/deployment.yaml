apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: sushiflix
  labels:
    app: jellyfin
spec:
  replicas: 1
  # one Jellyfin at a time on /config (SQLite)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          # 12.x migrates the database for good (back to 10.10 only by restoring /config) and needs a
          # full library scan after its first start
          image: docker.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"

          ports:
            - containerPort: 8096
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: servarr-data-v
              mountPath: /media
            - name: jellyfin-config-v
              mountPath: /config

      volumes:
        - name: servarr-data-v
          persistentVolumeClaim:
            claimName: servarr-data-pvc
        - name: jellyfin-config-v
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
