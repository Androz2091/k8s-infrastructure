apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: sushiflix
  labels:
    app: jellyfin
spec:
  replicas: 1
  # one Jellyfin at a time on /config (SQLite)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          # 10.10.7, the last 10.10 (same database schema as 10.10.3) and the step 12.0 asks for
          image: docker.io/jellyfin/jellyfin:10.10.7@sha256:7ae36aab93ef9b6aaff02b37f8bb23df84bb2d7a3f6054ec8fc466072a648ce2
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"

          ports:
            - containerPort: 8096
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: servarr-data-v
              mountPath: /media
            - name: jellyfin-config-v
              mountPath: /config

      volumes:
        - name: servarr-data-v
          persistentVolumeClaim:
            claimName: servarr-data-pvc
        - name: jellyfin-config-v
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
