apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: sushiflix
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          # 10.10.3: the build ":latest" resolved to when the node cached it (same digest, nothing changes)
          image: docker.io/jellyfin/jellyfin@sha256:040461da121ebe7f5055a385d0f1fc8e8260509041ff0fbce54ec52da2b6bf60
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"

          ports:
            - containerPort: 8096
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: servarr-data-v
              mountPath: /media
            - name: jellyfin-config-v
              mountPath: /config

      volumes:
        - name: servarr-data-v
          persistentVolumeClaim:
            claimName: servarr-data-pvc
        - name: jellyfin-config-v
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
