apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: sushiflix
  labels:
    app: overseerr
spec:
  replicas: 1
  # one Overseerr at a time on its SQLite database (it migrates at start)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overseerr
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      containers:
        - name: overseerr
          # Seerr continues the archived Overseerr and migrates its config at first start (no way back
          # but restoring the volume). It runs as the image's node user (UID 1000), which already owns
          # the files the linuxserver image wrote with PUID=1000
          image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: "Europe/Paris"

          ports:
            - containerPort: 5055
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: servarr-data-v
              mountPath: /media
            - name: overseerr-config-v
              mountPath: /app/config

      volumes:
        - name: servarr-data-v
          persistentVolumeClaim:
            claimName: servarr-data-pvc
        - name: overseerr-config-v
          persistentVolumeClaim:
            claimName: overseerr-config-pvc
