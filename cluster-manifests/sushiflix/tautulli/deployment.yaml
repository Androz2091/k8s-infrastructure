apiVersion: apps/v1
kind: Deployment
metadata:
  name: tautulli
  namespace: sushiflix
  labels:
    app: tautulli
spec:
  replicas: 1
  # one process at a time on its config database (it migrates at start)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tautulli
  template:
    metadata:
      labels:
        app: tautulli
    spec:
      containers:
        - name: tautulli
          image: lscr.io/linuxserver/tautulli:2.18.2
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"

          ports:
            - containerPort: 8181
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: tautulli-config-v
              mountPath: /config

      volumes:
        - name: tautulli-config-v
          persistentVolumeClaim:
            claimName: tautulli-config-pvc
