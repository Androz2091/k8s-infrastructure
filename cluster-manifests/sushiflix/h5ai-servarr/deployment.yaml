apiVersion: apps/v1
kind: Deployment
metadata:
  name: h5ai-servarr
  namespace: sushiflix
  labels:
    app: h5ai-servarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h5ai-servarr
  template:
    metadata:
      labels:
        app: h5ai-servarr
    spec:
      containers:
        - name: h5ai-servarr
          # latest as of 2026-10-29, pinned: an untagged image never updates with IfNotPresent (#115)
          image: awesometic/h5ai:latest@sha256:f45fc5a8ec89a3b7045fe83dcddb44eade4a143eb490bd9bcefa69c0d13476e5
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
            - name: HTPASSWD
              value: "true"
            - name: HTPASSWD_USER
              value: "read"
            - name: HTPASSWD_PW
              valueFrom:
                secretKeyRef:
                  name: h5ai-servarr-secrets
                  key: HTPASSWD_PW

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: servarr-data-v
              mountPath: /h5ai
            - name: h5ai-servarr-config-v
              mountPath: /config

      volumes:
        - name: servarr-data-v
          persistentVolumeClaim:
            claimName: servarr-data-pvc
        - name: h5ai-servarr-config-v
          persistentVolumeClaim:
            claimName: h5ai-servarr-config-pvc
