helmCharts:
  - name: onechart
    releaseName: theproptrade-giveaways-discord-bot
    namespace: managed
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: harbor.androz2091.fr/fiverr-discord-bots/theproptrade-giveaways-discord-bot
        tag: acfdf276
      secretName: theproptrade-giveaways-discord-bot-secrets
      imagePullSecrets:
      - regcred
      ports:
      - svcPort: 80
        name: http
        containerPort: 3000

namespace: managed

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
