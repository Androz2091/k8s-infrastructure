helmCharts:
  - name: onechart
    releaseName: docs-docent-discord-bot
    namespace: managed
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: androz2091/customgpt-discord-bot
        tag: sha-9cce4a1
      secretName: docs-docent-discord-bot-secrets

namespace: managed

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
