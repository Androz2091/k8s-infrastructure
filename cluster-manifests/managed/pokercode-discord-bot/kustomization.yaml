helmCharts:
  - name: onechart
    releaseName: pokercode-discord-bot
    namespace: managed
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: harbor.androz2091.fr/fiverr-discord-bots/pokercode
        tag: 58a30358
      secretName: pokercode-discord-bot-secrets
      ports:
      - svcPort: 80
        name: http
        containerPort: 3000
      imagePullSecrets:
      - regcred
      resources:
        limits:
          cpu: "5000m"

namespace: managed

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
