helmCharts:
  - name: onechart
    releaseName: cash-caval-discord-bot
    namespace: managed
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: harbor.androz2091.fr/fiverr-discord-bots/cash-caval-discord-bot
        tag: c1107454
      secretName: cash-caval-discord-bot-secrets
      ports:
      - svcPort: 80
        name: http
        containerPort: 3000
      imagePullSecrets:
      - regcred

namespace: managed

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
