kind: AppProject
apiVersion: argoproj.io/v1alpha1
metadata:
  name: workflows
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
  - server: https://kubernetes.default.svc
    namespace: "workflows"
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist: []
---
apiVersion: v1
kind: Namespace
metadata:
  name: workflows
  labels:
    name: workflows
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workflows-cluster-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/Androz2091/k8s-infrastructure.git
      revision: HEAD
      directories:
      - path: cluster-manifests/workflows/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "workflows"
      source:
        repoURL: https://github.com/Androz2091/k8s-infrastructure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: workflows
      # values a chart generates at random on every render: git can never match the live ones
      # (Harbor's internal keys, and the checksums of them that restart its pods)
      ignoreDifferences:
      - kind: Secret
        name: harbor-core
        jsonPointers: [/data/CSRF_KEY, /data/secret, /data/tls.crt, /data/tls.key]
      - kind: Secret
        name: harbor-jobservice
        jsonPointers: [/data/JOBSERVICE_SECRET]
      - kind: Secret
        name: harbor-registry
        jsonPointers: [/data/REGISTRY_HTTP_SECRET]
      - kind: Secret
        name: harbor-registry-htpasswd
        jsonPointers: [/data/REGISTRY_HTPASSWD]
      - group: apps
        kind: Deployment
        name: harbor-core
        jsonPointers: [/spec/template/metadata/annotations/checksum~1secret, /spec/template/metadata/annotations/checksum~1secret-jobservice]
      - group: apps
        kind: Deployment
        name: harbor-jobservice
        jsonPointers: [/spec/template/metadata/annotations/checksum~1secret, /spec/template/metadata/annotations/checksum~1secret-core]
      - group: apps
        kind: Deployment
        name: harbor-registry
        jsonPointers: [/spec/template/metadata/annotations/checksum~1secret, /spec/template/metadata/annotations/checksum~1secret-core, /spec/template/metadata/annotations/checksum~1secret-jobservice]
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true # a sync keeps the live values instead of new random ones
