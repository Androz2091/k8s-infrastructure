apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtrail
  namespace: home
  labels:
    app: airtrail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airtrail
  template:
    metadata:
      labels:
        app: airtrail
    spec:
      initContainers:
        - name: init-uploads
          image: busybox:1.37.0 # pinned: no pull from Docker Hub at every start
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/uploads
          volumeMounts:
            - name: airtrail-uploads
              mountPath: /app/uploads
      containers:
        - name: airtrail
          image: johly/airtrail:v3.13.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ORIGIN
              value: https://airtrail.androz2091.fr
            - name: UPLOAD_LOCATION
              value: /app/uploads
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: airtrail-secrets
                  key: DB_URL
            # log in through tinyauth (#104); the password form stays as a fallback
            - name: OAUTH_ENABLED
              value: "true"
            - name: OAUTH_ISSUER_URL
              value: https://auth.androz2091.fr/.well-known/openid-configuration
            - name: OAUTH_SCOPE
              value: openid profile email
            - name: OAUTH_AUTO_LOGIN   # the account is linked to tinyauth (2026-11-01): /login goes there directly
              value: "true"
            - name: OAUTH_AUTO_REGISTER
              value: "false"
            - name: OAUTH_BUTTON_TEXT
              value: Log in with tinyauth
          envFrom:
            - secretRef:
                name: airtrail-oauth   # OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: airtrail-uploads
              mountPath: /app/uploads
          resources: {}
      volumes:
        - name: airtrail-uploads
          persistentVolumeClaim:
            claimName: airtrail-uploads-pvc
