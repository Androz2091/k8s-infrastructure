apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfding
spec:
  template:
    spec:
      initContainers:
        - name: init-permissions
          image: busybox:1.37.0 # pinned: no pull from Docker Hub at every start
          command:
            - sh
            - -c
            - chown -R 1000:1000 /home/nonroot/pdfding/db /home/nonroot/pdfding/media
          volumeMounts:
            - name: db
              mountPath: /home/nonroot/pdfding/db
            - name: media
              mountPath: /home/nonroot/pdfding/media
