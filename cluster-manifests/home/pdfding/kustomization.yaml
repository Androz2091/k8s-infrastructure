helmCharts:
  - name: pdfding
    releaseName: pdfding
    namespace: home
    version: 0.2.13
    repo: https://charts.pdfding.com
    valuesInline:
      pdfding:
        # the chart reads pdfding.existingSecret (a name): the old top-level existingSecret.name was
        # ignored, so SECRET_KEY was the chart's public default "some_secret"
        existingSecret: pdfding-secrets
        config:
          accountEmailVerification:
            enabled: false
          hostName: pdfding.androz2091.fr
          hostPort: 3000
          disableUserSignup:
            enabled: true
          # log in through tinyauth only (#104): it matches the account by email, no password form.
          # The client secret is OIDC_CLIENT_SECRET in pdfding-secrets (sealed)
          oidc:
            enabled: true
            clientId: f697d34c-b223-4417-99f2-00a1dac4ac43
            authUrl: https://auth.androz2091.fr/.well-known/openid-configuration
            providerName: tinyauth
            oidc_only:
              enabled: true
      # the chart reads the top-level image.tag (pdfding.image.tag was always ignored: it ran the
      # chart's appVersion). PdfDing moved to codeberg.org/mrmn/PdfDing
      image:
        tag: v1.14.1
      # one process at a time on the SQLite database (it migrates at start)
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: longhorn
        dbSize: 500Mi
        mediaSize: 10Gi

namespace: home

resources:
- sealed-secrets.yaml

patches:
  - target:
      kind: Deployment
      name: pdfding
    path: patch-initcontainers.yaml
