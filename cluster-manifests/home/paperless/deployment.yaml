apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: home
  labels:
    app: paperless
spec:
  replicas: 1
  # the new version migrates the database at start: never two of them at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: webserver
          # 3.x (docs/migration-v3.md, from 2.20.15 only): rebuilds the search index (Tantivy) at
          # first start, no way back but the database dump
          image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/consume"
            - name: "PAPERLESS_URL"
              value: "https://documents.androz2091.fr"
            # EST itself is gone from the image's tzdata (Debian moved it to tzdata-legacy) and
            # Django refuses to start: same fixed UTC-5, without DST (POSIX sign: GMT+5 is UTC-5)
            - name: PAPERLESS_TIME_ZONE
              value: "Etc/GMT+5"
            # v3 only accepts "postgresql" (paperless-secrets has v2's "postgres"); env wins over envFrom
            - name: PAPERLESS_DBENGINE
              value: postgresql
            # v3 accepts duplicates by default: keep v2's rejection
            - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
              value: "true"
            - name: PAPERLESS_PORT
              value: "8000"
            # log in through tinyauth (#104): the provider (with its secret) is in paperless-oidc
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            # the account is linked to tinyauth (2026-11-01): the login page goes there directly
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
          envFrom:
            - secretRef:
                name: paperless-secrets
            - secretRef:
                name: paperless-oidc   # PAPERLESS_SOCIALACCOUNT_PROVIDERS
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-io
              mountPath: /consume
            - name: paperless-io
              mountPath: /export
              subPath: export
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: paperless-io
          persistentVolumeClaim:
            claimName: paperless-io
