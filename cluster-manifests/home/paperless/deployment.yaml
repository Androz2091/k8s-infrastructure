apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: home
  labels:
    app: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: webserver
          image: ghcr.io/paperless-ngx/paperless-ngx:2.14.7
          imagePullPolicy: IfNotPresent
          env:
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/consume"
            - name: "PAPERLESS_URL"
              value: "https://documents.androz2091.fr"
            - name: PAPERLESS_TIME_ZONE
              value: "EST"
            - name: PAPERLESS_PORT
              value: "8000"
            # log in through tinyauth (#104): the provider (with its secret) is in paperless-oidc
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            # the account is linked to tinyauth (2026-11-01): the login page goes there directly
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
          envFrom:
            - secretRef:
                name: paperless-secrets
            - secretRef:
                name: paperless-oidc   # PAPERLESS_SOCIALACCOUNT_PROVIDERS
          volumeMounts:
            - name: paperless-data
              mountPath: /usr/src/paperless/data
            - name: paperless-media
              mountPath: /usr/src/paperless/media
            - name: paperless-io
              mountPath: /consume
            - name: paperless-io
              mountPath: /export
              subPath: export
      volumes:
        - name: paperless-data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: paperless-media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: paperless-io
          persistentVolumeClaim:
            claimName: paperless-io
