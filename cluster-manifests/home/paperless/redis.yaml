apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: home
  labels:
    app: paperless-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: paperless-redis
              topologyKey: kubernetes.io/hostname

      containers:
        - name: redis
          # Valkey, as in Paperless's own compose: the bitnamilegacy/redis image is frozen (#89). Only
          # Celery's queue lives here, in memory, as before (no volume)
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: "REDIS_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: redis-password
                  name: paperless-redis-secrets
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  namespace: home
  labels:
    app: paperless-redis
spec:
  ports:
    - port: 6379
      protocol: TCP
      targetPort: 6379
  selector:
    app: paperless-redis
  type: ClusterIP
