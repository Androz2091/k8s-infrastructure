apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink
  namespace: home
  labels:
    app: shlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink
  template:
    metadata:
      labels:
        app: shlink
    spec:
      containers:
        - name: shlink
          # PHP 8.5.12: PHP2Shell is fixed (#115)
          image: shlinkio/shlink:5.1.8@sha256:68a722f7677008a50ccf3a9e570966bc37d7627fe6a870b86be28c5dcf9085ee
          imagePullPolicy: IfNotPresent
          # command: ["/bin/bash"]
          # args: ["-c", "sleep 999999"]

          # env:
          #   - name: ROCKET_PORT
          #     value: "4000"

          env:
            - name: DEFAULT_DOMAIN
              value: go.simonlefort.ch
            - name: IS_HTTPS_ENABLED
              value: "true"
            - name: DB_DRIVER
              value: "postgres"
            # Shlink 5 no longer guesses proxies: Caddy is the one in front, so visits keep the visitor's IP
            - name: TRUSTED_PROXIES
              value: "1"
          envFrom:
            - secretRef:
                name: shlink-secrets

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          resources: {}
