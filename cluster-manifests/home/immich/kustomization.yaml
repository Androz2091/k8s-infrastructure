helmCharts:
  - name: immich
    releaseName: immich
    namespace: home
    version: 0.9.0
    repo: https://immich-app.github.io/immich-charts
    valuesInline:
      useDeprecatedPostgresChart: true
      image:
        tag: v3.3.5
      immich:
        persistence:
          library:
            existingClaim: immich-library-pvc
      redis:
        enabled: true
        # bitnami/ dropped its versioned tags in 2025: same image (same digest) under bitnamilegacy/ (#89)
        image:
          repository: bitnamilegacy/redis
          tag: 7.2.5-debian-12-r0
          digest: sha256:5261cae9e4076b75d114e6bb032a0699c50b004ea06a680a5304c4c08d286adb
        architecture: standalone
        auth:
          enabled: false

      postgresql:
        enabled: true
        image:
          registry: ghcr.io
          repository: immich-app/postgres
          tag: 14-vectorchord0.3.0-pgvectors0.2.0
        global:
          postgresql:
            auth:
              username: immich
              database: immich
              password: immich
        primary:
          resourcesPreset: large
          containerSecurityContext:
            readOnlyRootFilesystem: false
          initdb:
            scripts:
              create-extensions.sql: |
                CREATE EXTENSION cube;
                CREATE EXTENSION earthdistance;
                CREATE EXTENSION vectors;

      env:
        DB_HOSTNAME: immich-postgresql.home.svc.cluster.local
        IMMICH_MEDIA_LOCATION: /usr/src/app/upload
        REDIS_HOSTNAME: immich-redis-master.home.svc.cluster.local

namespace: home

resources:
  - pvc.yaml
  - backup-mnt-lib-pod.yaml

patches: []
