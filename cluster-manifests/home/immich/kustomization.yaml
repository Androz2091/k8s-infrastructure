helmCharts:
  - name: immich
    releaseName: immich
    namespace: home
    version: 0.13.4
    repo: oci://ghcr.io/immich-app/immich-charts
    valuesInline:
      # server and machine-learning
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.3.5
              env:
                DB_HOSTNAME: immich-db.home.svc.cluster.local # PostgreSQL 17 (database-17.yaml), #107
                DB_USERNAME: immich
                DB_PASSWORD: immich
                DB_DATABASE_NAME: immich
                IMMICH_MEDIA_LOCATION: /usr/src/app/upload
      immich:
        persistence:
          library:
            existingClaim: immich-library-pvc
      server:
        persistence:
          data:
            # the chart's default moved to /data in 0.10.0, and Immich would rewrite every asset path
            # in the database to follow it: the library stays where it is
            type: persistentVolumeClaim
            existingClaim: immich-library-pvc
            globalMounts:
              - path: /usr/src/app/upload
      # replaces the frozen bitnamilegacy/redis (#89); a queue and cache only, kept in an emptyDir
      valkey:
        enabled: true

namespace: home

resources:
  - pvc.yaml
  - backup-mnt-lib-pod.yaml
  - database-17.yaml

# chart 0.10+ adds app.kubernetes.io/controller to the Deployments' selectors, which Kubernetes can't
# change in place: keep the 0.9.0 selectors (the pods still carry the label, the Services select on it)
patches:
  - target:
      kind: Deployment
      name: immich-(server|machine-learning)
    patch: |
      - op: remove
        path: /spec/selector/matchLabels/app.kubernetes.io~1controller
