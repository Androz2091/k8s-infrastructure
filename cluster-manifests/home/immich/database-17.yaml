# Immich's database on PostgreSQL 17, with the extension versions of the 14 it replaces (vchord 0.3.0,
# vector 0.8.0): the move is only a major upgrade (#107). POSTGRES_USER is a superuser here, so Immich
# can update its extensions itself later.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-db
  namespace: home
  labels:
    app: immich-db
spec:
  serviceName: immich-db
  replicas: 1
  selector:
    matchLabels:
      app: immich-db
  template:
    metadata:
      labels:
        app: immich-db
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:17-vectorchord0.3.0-pgvector0.8.0@sha256:9a669d9a0e3c1d68a10b9ba86157531539ee0cdbd71627a26c20850b88ca89b1
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD # the chart's DB_PASSWORD, already in kustomization.yaml
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: DB_STORAGE_TYPE # Immich's image tunes Postgres for spinning disks
              value: HDD
            - name: PGDATA # a subfolder: the volume's root has lost+found
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/default: enabled
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-db
  namespace: home
spec:
  selector:
    app: immich-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
