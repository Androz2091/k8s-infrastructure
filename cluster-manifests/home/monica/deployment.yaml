apiVersion: apps/v1
kind: Deployment
metadata:
  name: monica
  namespace: home
  labels:
    app: monica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monica
  template:
    metadata:
      labels:
        app: monica
    spec:
      containers:
        - name: monica
          # rebuilt 2026-10-28 with PHP 8.3.36: PHP2Shell is fixed (#115). The tag is rebuilt in place, hence the digest
          image: monica:5.0.0-beta.5-apache@sha256:722ea85f1c08b94c4b81346d4b647e93b55c2a54e05c7d3d15af7b937517fc24
          imagePullPolicy: IfNotPresent

          env:
            - name: DB_CONNECTION
              value: pgsql
            - name: APP_URL
              value: https://monica.androz2091.fr
            - name: ASSET_URL
              value: https://monica.androz2091.fr
            - name: APP_FORCE_URL
              value: "true"
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
          envFrom:
            - secretRef:
                name: monica-secrets

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources: {}
