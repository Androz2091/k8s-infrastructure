apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: home
  labels:
    app: vaultwarden
spec:
  replicas: 1
  # one SQLite file: never two servers on it, even for the seconds of a rolling update
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          imagePullPolicy: IfNotPresent
          # command: ["/bin/bash"]
          # args: ["-c", "sleep 999999"]

          env:
            # the server is public: nobody but me gets an account (the default is true)
            - name: SIGNUPS_ALLOWED
              value: "false"

          ports:
            - containerPort: 80
              name: http
              protocol: TCP

          resources: {}

          volumeMounts:
            - name: vaultwarden-data-v
              mountPath: /data/

#reclaim policy
      volumes:
        - name: vaultwarden-data-v
          persistentVolumeClaim:
            claimName: vaultwarden-data-pvc
