kind: AppProject
apiVersion: argoproj.io/v1alpha1
metadata:
  name: pro
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
  - server: https://kubernetes.default.svc
    namespace: "pro"
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist: []
---
apiVersion: v1
kind: Namespace
metadata:
  name: pro
  labels:
    name: pro
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pro-cluster-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/Androz2091/k8s-infrastructure.git
      revision: HEAD
      directories:
      - path: cluster-manifests/pro/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "pro"
      source:
        repoURL: https://github.com/Androz2091/k8s-infrastructure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: pro
      # values a chart generates at random on every render: git can never match the live ones
      ignoreDifferences:
      - kind: Secret
        name: umami-analytics-app-secret
        jsonPointers:
        - /data/app-secret
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true # a sync keeps the live values instead of new random ones
