kind: AppProject
apiVersion: argoproj.io/v1alpha1
metadata:
  name: monitoring
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
  - server: https://kubernetes.default.svc
    namespace: "monitoring"
  # kube-prometheus-stack puts its CoreDNS scrape Service next to CoreDNS: a Service only selects pods in its own namespace
  - server: https://kubernetes.default.svc
    namespace: "kube-system"
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist: []
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-cluster-manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/Androz2091/k8s-infrastructure.git
      revision: HEAD
      directories:
      - path: cluster-manifests/monitoring/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: "monitoring"
      source:
        repoURL: https://github.com/Androz2091/k8s-infrastructure.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
