helmCharts:
  - name: onechart
    releaseName: androzdev-discord-bot
    namespace: pro
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      secretName: androzdev-discord-bot-secrets
      image:
        repository: androz2091/androzdev-bot
        # same commit, rebuilt on Node 22.23.4 (#114): the tag was overwritten, so pinned by digest
        tag: sha-cdc6676@sha256:28a32f2653bc4648f52721dcf442562e1aa7586ec64b1d6357d2c3c3c5a9b4e5
      resources:
        requests:
          cpu: "200m"
          memory: "500Mi"

namespace: pro

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
