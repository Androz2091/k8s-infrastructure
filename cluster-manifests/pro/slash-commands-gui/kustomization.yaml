helmCharts:
  - name: onechart
    releaseName: slash-commands-gui
    namespace: pro
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: androz2091/slash-commands-gui
        tag: 1.5.0
      ports:
      - svcPort: 80
        name: http
        containerPort: 80
      resources:
        requests:
          cpu: "200m"
          memory: "500Mi"

namespace: pro

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
