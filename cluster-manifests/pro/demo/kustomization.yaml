# A tiny app for live demos: open https://demo.androz2091.fr, change replicas or the
# text in default.conf, push, `argocd app sync demo`.
# The ConfigMap name changes with its content, so every edit rolls out new pods.
namespace: pro

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: demo-conf
    files:
      - default.conf
