helmCharts:
  - name: onechart
    releaseName: diswho
    namespace: pro
    version: 0.70.0
    valuesFile: ../../../charts/onechart-common-values.yaml
    valuesInline:
      image:
        repository: androz2091/diswho
        tag: sha-18c8c52
      secretName: diswho-secrets
      ports:
      - svcPort: 80
        name: http
        containerPort: 3050
      resources:
        requests:
          cpu: "200m"
          memory: "500Mi"

namespace: pro

resources:
  - sealed-secrets.yaml

patches: []

# onechart is vendored in charts/ (its repository is gone, #59)
helmGlobals:
  chartHome: ../../../charts
