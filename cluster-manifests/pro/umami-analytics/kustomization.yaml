# Upgrading: Umami runs its Prisma migrations at startup. A long data backfill (e.g.
# 09_update_hostname_region) can be killed by the startup probe, leaving a failed row in
# _prisma_migrations and a half-applied schema; later starts then fail with P3009.
# Before bumping the chart, scale to 0 and run the migrations in a one-shot pod:
#
#   kubectl -n pro scale deploy umami-analytics --replicas=0
#   kubectl run umami-migrate --rm -i -n pro --restart=Never --image=ghcr.io/umami-software/umami:X.Y.Z \
#     --overrides='{"spec":{"containers":[{"name":"umami-migrate","image":"ghcr.io/umami-software/umami:X.Y.Z",
#       "envFrom":[{"secretRef":{"name":"umami-analytics-secrets"}}],
#       "command":["sh","-c","export PATH=$PWD/node_modules/.bin:$PATH && node scripts/check-db.js"]}]}}'
#   argocd app sync umami-analytics   # the new image, back to 1 replica
#
# check-db.js is the image's own startup check: DB version, then `prisma migrate deploy`. v3 images
# are tagged X.Y.Z (no more postgresql-vX.Y.Z, v3 only supports PostgreSQL) and have no npx.
#
# After a failed attempt: check the schema by hand (columns, indexes, _prisma_migrations), finish
# the missing SQL, then `prisma migrate resolve --applied <migration_name>` from such a pod (same PATH).
helmCharts:
  - name: umami
    releaseName: umami-analytics
    namespace: pro
    version: 8.1.0
    repo: https://charts.christianhuth.de
    valuesInline:
      # one version at a time against the database
      deploymentStrategy:
        type: Recreate
      postgresql:
        enabled: false
      database:
        existingSecret: umami-analytics-secrets
        databaseUrlKey: DATABASE_URL

namespace: pro

resources:
  - sealed-secrets.yaml

patchesJson6902:
  - target:
      version: v1
      kind: Deployment
      name: umami-analytics
      namespace: pro
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
      - op: remove
        path: /spec/template/spec/containers/0/livenessProbe
