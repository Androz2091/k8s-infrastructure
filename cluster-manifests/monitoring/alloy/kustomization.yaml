# Grafana Alloy ships the pods' logs to Loki, replacing Promtail (end of life). Its config was
# converted from Promtail's own (alloy convert --source-format=promtail), same labels (#117)
helmCharts:
  - name: alloy
    releaseName: alloy
    namespace: monitoring
    version: 1.15.0
    repo: https://grafana.github.io/helm-charts
    valuesInline:
      controller:
        type: daemonset
        # both nodes, like Promtail (the VPS has the control-plane taint)
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        volumes:
          extra:
            - name: promtail-positions
              hostPath:
                path: /run/promtail
            - name: alloy-data
              hostPath:
                path: /var/lib/alloy
                type: DirectoryOrCreate
      alloy:
        # on the host, so a restart doesn't re-read every log file
        storagePath: /var/lib/alloy
        mounts:
          varlog: true
          extra:
            - name: promtail-positions   # read once: Alloy continues where Promtail stopped
              mountPath: /run/promtail
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy
        extraEnv:
          # the converted config filters pods on HOSTNAME, which Promtail's chart set to the node name
          - name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        configMap:
          content: |
              discovery.kubernetes "kubernetes_pods" {
                role = "pod"

                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              loki.process "kubernetes_pods" {
                forward_to = [loki.write.default.receiver]

                stage.cri { }
              }

              discovery.relabel "kubernetes_pods" {
                targets = discovery.kubernetes.kubernetes_pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_controller_name"]
                  regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
                  target_label  = "__tmp_controller_name"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "app"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance", "__meta_kubernetes_pod_label_instance"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "instance"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "component"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node_name"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["namespace", "app"]
                  separator     = "/"
                  target_label  = "job"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash", "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  regex         = "true/(.*)"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              loki.source.file "kubernetes_pods" {
                targets    = discovery.relabel.kubernetes_pods.output
                forward_to = [loki.process.kubernetes_pods.receiver]

                file_match {
                  enabled = true
                }
                legacy_positions_file = "/run/promtail/positions.yaml"
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
                external_labels = {}
              }
      serviceMonitor:
        enabled: true

namespace: monitoring
