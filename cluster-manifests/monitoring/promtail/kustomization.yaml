helmCharts:
  - name: promtail
    includeCRDs: true
    releaseName: promtail
    namespace: monitoring
    version: 6.17.1
    repo: https://grafana.github.io/helm-charts
    valuesInline:
      serviceMonitor:
        enabled: true
      # replaced by Alloy (monitoring/alloy, #117): a nodeSelector no node has keeps the DaemonSet at
      # 0 pods (its positions stay on the host for Alloy). Delete this folder and the app afterwards
      nodeSelector:
        replaced-by-alloy: "never"
      config:
        clients:
          - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

resources: []

namespace: monitoring
