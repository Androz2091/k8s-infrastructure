
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.31.14
clusterName: kubernetes
controlPlaneEndpoint: api.k8s.internal:6443
apiServer:
  certSANs:
    - api.k8s.internal
    - 10.8.0.1
    - 10.8.0.2
certificatesDir: /etc/kubernetes/pki
caCertificateValidityPeriod: 87600h0m0s
certificateValidityPeriod: 8760h0m0s
encryptionAlgorithm: RSA-2048
etcd:
  local:
    dataDir: /var/lib/etcd
    extraArgs:
      # metrics also on the tunnel, for Prometheus on ns561436 (plain HTTP, no secret; the VPS firewall only opens wg0)
      - name: listen-metrics-urls
        value: http://127.0.0.1:2381,http://10.8.0.1:2381
imageRepository: registry.k8s.io
networking:
  dnsDomain: cluster.local
  serviceSubnet: 10.96.0.0/12
  podSubnet: 10.244.0.0/16
controllerManager: {}
scheduler: {}
dns: {}
proxy: {}
