- name: Bootstrap a cluster node
  hosts: all
  become: true

  vars:
    # one minor at a time (README > Upgrade Kubernetes); CRI-O follows Kubernetes' minor
    kubernetes_repo: v1.34
    kubernetes_version: 1.34.13-1.1
    crio_repo: v1.34
    crio_version: 1.34.15-2.1
    # the PauseVersion of this kubeadm minor (kubeadm's preflight warns when CRI-O's differs)
    pause_image: registry.k8s.io/pause:3.10.1

  tasks:

    - name: Preflight checks
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "12"
          - ansible_facts.swaptotal_mb == 0
        fail_msg: "Expected Debian 12 with swap off, refusing to continue"
      tags: always

    # kubelet refuses to start with swap on, and the OVH install lists both disks' swap partitions
    # in /etc/fstab: `swapoff -a` alone lasts until the next boot (#58)
    - name: No swap at boot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s.*)$'
        replace: '# \1'
      tags: kubelet

    - name: SSH accepts keys only and sheds bots quickly
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          # Managed by ansible/bootstrap.yaml. Must sort before 50-cloud-init.conf:
          # sshd keeps the FIRST value it reads, and that file says "PasswordAuthentication yes".
          PasswordAuthentication no
          LoginGraceTime 20
          PerSourceMaxStartups 3
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
      tags: ssh

    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: firewall

    - name: Install this node's firewall rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../firewall/{{ inventory_hostname }}.nft"
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nft -c -f %s
      notify: Load firewall rules
      tags: firewall

    # we only enable the service, we don't restart or stop it
    # indeed on Debian, stopping nftables.service will run "nft flush ruleset"
    # which would also wipe kube-proxy's and Flannel's rules
    - name: Load the firewall at every boot
      ansible.builtin.systemd:
        name: nftables
        enabled: true
      ignore_errors: "{{ ansible_check_mode }}"
      tags: firewall

    - name: Load the kernel modules at every boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"
      tags: kernel

    - name: Load the kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
      tags: kernel

    - name: Let the node route pod traffic
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward
      tags: kernel

    - name: Let containers watch many files (kubectl logs -f, Promtail)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { name: fs.inotify.max_user_instances, value: "1024" }
        - { name: fs.inotify.max_user_watches, value: "1048576" }
      tags: kernel

    # kubelet's resolvConf (kubeadm/kubelet-config.yaml): a file of its own, because
    # /run/systemd/resolve/resolv.conf disappears at boot where systemd-resolved is off (#58)
    - name: Upstream DNS for kubelet's pods
      ansible.builtin.copy:
        dest: /etc/kubernetes/kubelet-resolv.conf
        content: |
          # Managed by ansible/bootstrap.yaml: OVH's resolver, then Cloudflare's
          nameserver 213.186.33.99
          nameserver 1.1.1.1
        owner: root
        group: root
        mode: "0644"
      tags: kubelet

    # kubelet's graceful shutdown needs logind to allow its delay (220 s). kubelet writes
    # 99-kubelet.conf, but unattended-upgrades' drop-in (InhibitDelayMaxSec=30) sorts after it and wins
    - name: logind drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"
      tags: kubelet

    - name: Mask unattended-upgrades' 30 s cap on shutdown delays
      ansible.builtin.file:
        src: /dev/null
        dest: /etc/systemd/logind.conf.d/unattended-upgrades-logind-maxdelay.conf
        state: link
        force: true
      notify: Restart logind, then kubelet
      tags: kubelet

    - name: Install WireGuard tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
      tags: packages


    - name: WireGuard tunnel config (no secret inside)
      ansible.builtin.template:
        src: templates/wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart WireGuard
      tags: wireguard

    - name: Bring the tunnel up now and at every boot
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true
      tags: wireguard

    - name: Caddy, on the node that takes the public traffic
      when: "'apps' in group_names"
      tags: caddy
      block:
        - name: Install Caddy
          ansible.builtin.apt:
            name: caddy
            state: present

        - name: Caddy serves the repo's Caddyfile
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../Caddyfile"
            dest: /etc/caddy/Caddyfile
            owner: root
            group: root
            mode: "0644"
            validate: caddy validate --adapter caddyfile --config %s
          notify: Reload Caddy

        - name: Caddy runs as a service, now and at every boot
          ansible.builtin.systemd:
            name: caddy
            state: started
            enabled: true
          tags: caddy-start

    - name: Kubernetes API endpoint name
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ k8s_api_name | regex_escape }}$'
        line: "{{ k8s_api_address }}  {{ k8s_api_name }}"
      tags: hosts

    - name: Add the Kubernetes and CRI-O apt repositories
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.url }}"
        suites: /
        signed_by: "{{ item.url }}Release.key"
      loop:
        - name: kubernetes
          url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo }}/deb/"
        # CRI-O left pkgs.k8s.io in 2025 (its v1.33+ are only here)
        - name: cri-o
          url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_repo }}/deb/"
      tags: [packages, repos]

    - name: CRI-O and Kubernetes
      tags: packages
      ignore_errors: "{{ ansible_check_mode }}"
      block:
        - name: Install the same versions as the main node
          ansible.builtin.apt:
            name:
              - "cri-o={{ crio_version }}"
              - "kubelet={{ kubernetes_version }}"
              - "kubeadm={{ kubernetes_version }}"
              - "kubectl={{ kubernetes_version }}"
              - conntrack
            state: present
            update_cache: true

        - name: Hold them so apt never upgrades them on its own
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop:
            - cri-o
            - kubelet
            - kubeadm
            - kubectl

        - name: Start CRI-O now and at every boot
          ansible.builtin.systemd:
            name: crio
            state: started
            enabled: true

    - name: CRI-O's pause image is the one kubeadm expects
      ansible.builtin.copy:
        dest: /etc/crio/crio.conf.d/20-pause-image.conf
        content: |
          # Managed by ansible/bootstrap.yaml
          [crio.image]
          pause_image = "{{ pause_image }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart CRI-O
      tags: packages

    # kubeadm up to 1.34 writes this flag on init/join; kubelet 1.35 refuses to start with it.
    # Since 1.27 it only kept the pause image from being garbage-collected (CRI-O pins its own)
    - name: kubelet runs without --pod-infra-container-image
      ansible.builtin.replace:
        path: /var/lib/kubelet/kubeadm-flags.env
        regexp: ' --pod-infra-container-image=[^" ]*'
        replace: ''
      failed_when: false   # no such file before kubeadm init/join
      notify: Restart kubelet
      tags: kubelet

    - name: kubelet uses the tunnel address as the node IP
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: "KUBELET_EXTRA_ARGS=--node-ip={{ wg_address }}"
        create: true
        mode: "0644"
      tags: kubelet

  handlers:
    # only when it runs: the first run installs the file before the switch from `caddy start` (#98)
    - name: Reload Caddy
      ansible.builtin.shell: if systemctl is-active --quiet caddy; then systemctl reload caddy; fi
    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
    # systemd 252's logind ignores kubelet's reload signal; kubelet takes its shutdown lock at start
    - name: Restart logind, then kubelet
      ansible.builtin.shell: >
        systemctl restart systemd-logind &&
        if systemctl is-active --quiet kubelet; then systemctl restart kubelet; fi
    - name: Load firewall rules
      ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.conf
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted
    # neither restart touches running containers: each container's conmon lives in its own
    # crio-conmon-*.scope, outside crio.service's cgroup, and kubelet just reattaches
    - name: Restart CRI-O
      ansible.builtin.systemd:
        name: crio
        state: restarted
    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
